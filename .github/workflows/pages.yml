name: Build and deploy portfolio

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Node for JavaScript checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the image encoder
        run: python -m pip install -r requirements.txt
      - name: Test content compiler and public artifact
        run: python -B -m unittest discover -s tests -v
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check atlas-overview.js
          node --check navigation.js
          node --test tests/*.test.cjs
      - name: Restore optimized photo cache
        if: ${{ hashFiles('content/photo-assets.json') == '' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: generated/thumbnails
          key: photo-thumbnails-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/thumbnail_images.py', 'content/**') }}
          restore-keys: |
            photo-thumbnails-${{ runner.os }}-
      - name: Build and validate the public site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            python -B scripts/build_site.py --base-url "$SITE_URL"
          else
            python -B scripts/build_site.py
          fi
      - name: Upload the public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
